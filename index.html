<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Pradnya ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
height:100vh;overflow:hidden;display:flex;
justify-content:center;align-items:center;text-align:center;
}
.container{z-index:2}
h1{color:white;font-size:2.5rem;margin-bottom:25px}
button{
border:none;padding:15px 35px;margin:10px;border-radius:50px;
cursor:pointer;font-size:20px;transition:.3s;
}
#yesBtn{background:#ff4081;color:white}
#noBtn{background:white;color:#ff4081;position:absolute}
.heart{position:absolute;animation:float 8s linear infinite}
@keyframes float{
from{transform:translateY(100vh)}
to{transform:translateY(-100px)}
}
</style>
</head>
<body>
<div class="container">
<h1>Pradnya ❤️<br>Will You Be Mine Forever? 🥹</h1>
<button id="yesBtn">Yes ❤️</button>
<button id="noBtn">No 😢</button>
</div>

<script>
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
let yesSize=20;

function moveButton(){
const x=Math.random()*(window.innerWidth-120);
const y=Math.random()*(window.innerHeight-80);
noBtn.style.left=x+"px";
noBtn.style.top=y+"px";
yesSize+=8;
yesBtn.style.fontSize=yesSize+"px";
}

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);

yesBtn.addEventListener("click",()=>{
document.body.innerHTML=`
<div style="height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;background:linear-gradient(135deg,#ff758c,#ff7eb3);color:white;padding:20px">
<h1>YAYYY PRADNYA ❤️🥰</h1>
<h2>I Love You Forever 🌹</h2>
<p style="margin-top:20px;font-size:1.3rem">
You just made me the happiest person alive ❤️
</p>
</div>`;
});

for(let i=0;i<40;i++){
let h=document.createElement("div");
h.innerHTML="❤️";
h.classList.add("heart");
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(Math.random()*25+15)+"px";
h.style.animationDuration=(Math.random()*5+5)+"s";
document.body.appendChild(h);
}
</script>
</body>
</html>
